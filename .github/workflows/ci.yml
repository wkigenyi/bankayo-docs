name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:pages
      - run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://docs.bankayo.io
          NEXT_PUBLIC_APP_URL: https://app.bankayo.io
